<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ladderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="102" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Stylized Tech Ladder & Wall Motif -->
  <g filter="url(#glow)">
    <!-- Left Stile -->
    <rect x="150" y="116" width="30" height="280" rx="15" fill="url(#ladderGrad)"/>
    <!-- Right Stile -->
    <rect x="332" y="116" width="30" height="280" rx="15" fill="url(#ladderGrad)"/>

    <!-- Ladder Rungs -->
    <rect x="150" y="160" width="212" height="22" rx="11" fill="url(#ladderGrad)"/>
    <rect x="150" y="224" width="212" height="22" rx="11" fill="url(#ladderGrad)"/>
    <rect x="150" y="288" width="212" height="22" rx="11" fill="url(#ladderGrad)"/>
    <rect x="150" y="352" width="212" height="22" rx="11" fill="url(#ladderGrad)"/>

    <!-- Central Signal Pillar (Connecting steps) -->
    <rect x="246" y="136" width="20" height="240" rx="10" fill="url(#coreGrad)"/>
  </g>
</svg>
